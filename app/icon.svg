<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#grad)"/>
  
  <!-- Graduation cap -->
  <g transform="translate(50, 50)">
    <!-- Cap board -->
    <polygon points="-25,-15 25,-15 30,-10 -30,-10" fill="#fff"/>
    
    <!-- Cap top -->
    <rect x="-8" y="-25" width="16" height="10" fill="#fff" rx="2"/>
    
    <!-- Tassel -->
    <line x1="8" y1="-25" x2="15" y2="-30" stroke="#FCD34D" stroke-width="2"/>
    <circle cx="15" cy="-30" r="3" fill="#FCD34D"/>
    
    <!-- Book pages -->
    <rect x="-20" y="-5" width="40" height="25" fill="#fff" rx="2"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
    <line x1="-20" y1="10" x2="20" y2="10" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
    <line x1="-20" y1="15" x2="20" y2="15" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
